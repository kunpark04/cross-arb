[package]
name = "cross-arb-bot"
version = "0.1.0"
edition = "2021"
description = "cross-arb live trading bot (Rust) — SAFE BY DEFAULT (dry-run/demo/caps/kill-switch). See decision 0015 + README."
publish = false

# Stage 1 (this build) is std-only on purpose: the safety-critical spine (types, config, risk gates,
# execution backends, ledger) compiles offline with NO external crates, so there is zero dependency
# surface in the part that decides and gates trades.
#
# Stage 2 (venue I/O + live transport). Built locally, transferred to the droplet later. Crypto/async
# crates are pure-Rust (compile cleanly on windows-gnu); the TLS crates (reqwest/tungstenite) use
# RUSTLS (ring) — NOT native-tls/OpenSSL — to avoid an OpenSSL build dependency on windows-gnu.
[dependencies]
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
ed25519-dalek = "2"            # pmus Ed25519 signing
rsa = { version = "0.9", features = ["sha2"] }  # Kalshi RSA-PSS signing
sha2 = "0.10"
signature = "2"
rand = "0.8"                   # OsRng for RSA-PSS salt + keygen (rand_core 0.6, matches rsa 0.9)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
dotenvy = "0.15"              # load bot-rs/.env (key paths + safety vars) at startup
# --- TLS / network (added + compile-checked in the next phase) ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[[bin]]
name = "cross-arb-bot"
path = "src/main.rs"
